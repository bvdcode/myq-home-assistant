name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version and publish
    if: >-
      github.event.head_commit.author.name != 'github-actions[bot]' ||
      !startsWith(github.event.head_commit.message, 'chore(release): ')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Pin checkout to the triggering commit
        run: git reset --hard "${{ github.sha }}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy custom_components/myq tests

      - name: Test
        run: pytest

      - name: Validate with HACS
        uses: hacs/action@main
        with:
          category: integration

      - name: Validate with Hassfest
        uses: home-assistant/actions/hassfest@ab22029681aa532bfe7de5774a9972d67bfbd2c0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install GitVersion
        uses: GitTools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: 6.8.2

      - name: Determine version
        id: gitversion
        uses: GitTools/actions/gitversion/execute@v4.7.0

      - name: Prepare versioned release
        id: release
        env:
          RELEASE_VERSION: ${{ steps.gitversion.outputs.MajorMinorPatch }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git log -1 --format=%B "$GITHUB_SHA" > release-notes.md
          python - "$RELEASE_VERSION" <<'PY'
          import json
          import sys
          from datetime import UTC, datetime
          from pathlib import Path

          version = sys.argv[1]
          path = Path("custom_components/myq/manifest.json")
          manifest: dict[str, object] = json.loads(path.read_text())
          manifest["version"] = version
          path.write_text(json.dumps(manifest, indent=2) + "\n")
          changelog = Path("CHANGELOG.md")
          content = changelog.read_text()
          marker = "<!-- version list -->"
          if content.count(marker) != 1:
              raise RuntimeError("Expected one version list marker in CHANGELOG.md")
          notes = Path("release-notes.md").read_text().strip()
          date = datetime.now(UTC).date().isoformat()
          entry = f"\n\n## v{version} ({date})\n\n{notes}\n"
          changelog.write_text(content.replace(marker, marker + entry, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/myq/manifest.json CHANGELOG.md
          git commit -m "chore(release): $RELEASE_VERSION"
          git tag "$tag"
          git push --atomic origin HEAD:main "$tag"
          {
            echo "released=true"
            echo "tag=$tag"
            echo "version=$RELEASE_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Package integration
        if: steps.release.outputs.released == 'true'
        working-directory: custom_components/myq
        run: >-
          zip -r "$GITHUB_WORKSPACE/myq.zip" .
          -x "*/__pycache__/*" "*.pyc" "*.pyo"

      - name: Publish GitHub release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          gh release create "$RELEASE_TAG"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "MyQ $RELEASE_VERSION"
          --notes-file release-notes.md
          myq.zip
